<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Special Day for Sonia ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff0f5,#ffe4ec);color:#4a2330;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(520px,100%);background:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 18px 50px #8d405522;text-align:center}
h1{font-size:30px;margin:5px 0 10px}h2{font-size:25px;margin:8px 0 20px}.sub{color:#8b5a68;margin-bottom:25px}
.page{display:none}.page.active{display:block}.heart{font-size:58px;animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.12)}}
button,.option{width:100%;border:0;border-radius:16px;padding:15px;margin:8px 0;font-size:17px;cursor:pointer}
.start,.finish{background:#e94f7a;color:white;font-weight:700}.option{background:#fff5f8;border:2px solid #f4c6d3;color:#542b38;text-align:left}.option.selected{background:#f8a8be;border-color:#e94f7a;color:#fff;font-weight:700}
.next{background:#5d3140;color:white;margin-top:18px}.back{background:#f3e4e9;color:#542b38}.summary{background:#fff7f9;border-radius:18px;padding:16px;text-align:left;line-height:1.8;margin:18px 0}.small{font-size:13px;color:#98717c;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div id="p0" class="page active">
    <div class="heart">❤️</div>
    <h1>A Special Day for Sonia</h1>
    <p class="sub">Sonia, today you get to choose our perfect day together.</p>
    <button class="start" onclick="go(1)">Start ❤️</button>
  </div>

  <div id="p1" class="page">
    <h2>🍕 What should we eat?</h2>
    <div id="food"></div><button class="next" onclick="go(2)">Next →</button>
  </div>

  <div id="p2" class="page">
    <h2>🎬 What should we watch?</h2>
    <div id="movie"></div><button class="next" onclick="go(3)">Next →</button>
  </div>

  <div id="p3" class="page">
    <h2>🌹 What should we do?</h2>
    <div id="place"></div><button class="next" onclick="go(4)">Next →</button>
  </div>

  <div id="p4" class="page">
    <div class="heart">💖</div>
    <h2>Your Perfect Day</h2>
    <p class="sub">Sonia, these are your choices:</p>
    <div class="summary" id="summary"></div>
    <button class="finish" onclick="finish()">Send My Choices ❤️</button>
    <button class="back" onclick="go(3)">← Back</button>
    <p class="small">Your choices are saved on this device. You can also screenshot this page and send it.</p>
  </div>
</div>

<script>
const data={
 food:["🍕 Pizza","🍔 Burger","🍣 Sushi","🍝 Pasta","🍗 Afghan Food","✨ Surprise me"],
 movie:["🎬 Cinema","🏠 Movie at home","😂 Comedy","❤️ Romantic","👻 Horror","✨ You choose"],
 place:["🌳 Park","☕ Coffee","🛍️ Shopping","🎳 Bowling","📸 Photos","🎁 Surprise date"]
};
const choice={food:"",movie:"",place:""};
function render(id,key){
 const box=document.getElementById(id);
 box.innerHTML="";
 data[key].forEach(x=>{
  const b=document.createElement("button"); b.className="option"; b.textContent=x;
  b.onclick=()=>{choice[key]=x; [...box.children].forEach(c=>c.classList.remove("selected")); b.classList.add("selected");};
  box.appendChild(b);
 });
}
render("food","food");render("movie","movie");render("place","place");
function go(n){
 if(n===2&&!choice.food)return alert("Sonia, please choose your food ❤️");
 if(n===3&&!choice.movie)return alert("Please choose a movie 🎬");
 if(n===4&&!choice.place)return alert("Please choose what we should do 🌹");
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById("p"+n).classList.add("active");
 if(n===4)document.getElementById("summary").innerHTML=
   "🍕 <b>Food:</b> "+choice.food+"<br>🎬 <b>Movie:</b> "+choice.movie+"<br>🌹 <b>Plan:</b> "+choice.place;
}
function finish(){
 localStorage.setItem("soniaChoices",JSON.stringify(choice));
 const text=`Sonia's choices ❤️%0A🍕 Food: ${choice.food}%0A🎬 Movie: ${choice.movie}%0A🌹 Plan: ${choice.place}`;
 if(navigator.share) navigator.share({title:"Sonia's Perfect Day ❤️",text:"Sonia's choices ❤️\n🍕 Food: "+choice.food+"\n🎬 Movie: "+choice.movie+"\n🌹 Plan: "+choice.place});
 else window.location.href="mailto:?subject=Sonia's Perfect Day ❤️&body="+text;
}
</script>
</body>
</html>
